name: "Download VOICEVOX ENGINE"
description: |
  VOICEVOX ENGINEをダウンロードし、指定したディレクトリに展開する。
inputs:
  repo:
    description: "リポジトリ名。デフォルトはVOICEVOX/voicevox_engine。"
    required: false
    default: "VOICEVOX/voicevox_engine"
  version:
    description: "VOICEVOX ENGINEのバージョン。latest（デフォルト）、prerelease-latest、バージョン番号（例：0.14.4）で指定できる。"
    required: false
    default: "latest"
  dest:
    description: "VOICEVOX ENGINEを展開するディレクトリ。"
    required: true
  target:
    description: "ダウンロードする対象。デフォルトは各OSのCPU版。"
    required: false
    default: ""

outputs:
  run_path:
    description: "run.exe、またはrunのパス。"
    value: ${{ steps.result.outputs.run_path }}
  version:
    description: "VOICEVOX ENGINEのバージョン。"
    value: ${{ steps.result.outputs.version }}
runs:
  using: "composite"
  steps:
    - name: Setup tempdir
      shell: bash
      run: |
        TEMPDIR=$(echo '${{ runner.temp }}/download-engine' | sed -e 's_\\_/_g')
        echo "TEMPDIR=$TEMPDIR" >> "$GITHUB_ENV"
        mkdir -p "$TEMPDIR"

        DEST=$(echo '${{ inputs.dest }}' | sed -e 's_\\_/_g')
        echo "DEST=$DEST" >> "$GITHUB_ENV"

    - name: Get version
      shell: bash
      run: |
        curl -fs https://api.github.com/repos/${{ inputs.repo }}/releases \
            -H 'authorization: Bearer ${{ github.token }}' \
            -H 'content-type: application/json' > "$TEMPDIR/releases.json"

        if [ "${{ inputs.version }}" = "latest" ]; then
          jq -er '[.[] | select(.prerelease == false)][0]' "$TEMPDIR/releases.json" > "$TEMPDIR/target.json"
        elif [ "${{ inputs.version }}" = "prerelease-latest" ]; then
          jq -er '[.[] | select(.prerelease == true)][0]' "$TEMPDIR/releases.json" > "$TEMPDIR/target.json"
        else
          jq -er '[.[] | select(.tag_name == "${{ inputs.version }}")][0]' "$TEMPDIR/releases.json" > "$TEMPDIR/target.json"
        fi

    - name: Download and Extract
      shell: bash
      run: |
        if [ "${{ inputs.target }}" = "" ]; then
          OS=$(echo "${{ runner.os }}" | tr "[:upper:]" "[:lower:]") # 小文字にする
          TARGET="$OS-cpu"
        else
          TARGET="${{ inputs.target }}"
        fi

        # リリース情報からファイル一覧のtxtを取得
        jq -er '[.assets[] | select(.name | contains("'"$TARGET"'") and endswith(".7z.txt"))][0]' "$TEMPDIR/target.json" > "$TEMPDIR/assets_txt.json"
        LIST_URL=$(jq -er '.browser_download_url' "$TEMPDIR/assets_txt.json")
        echo "7z.txt url: $LIST_URL"
        curl -fsSL --retry 3 --retry-delay 5 "$LIST_URL" > "$TEMPDIR/download_name.txt"
        echo "Files to download:"
        sed -e 's|^|- |' "$TEMPDIR/download_name.txt"

        # バージョン情報を取得
        ENGINE_VERSION=$(jq -er '.tag_name' "$TEMPDIR/target.json")
        echo "ENGINE_VERSION=$ENGINE_VERSION" >> "$GITHUB_ENV"

        # ファイル一覧のtxtにあるファイルをダウンロード
        while read -r i || [ -n "$i" ]; do
          URL=$(jq -er "[.assets[] | select(.name == \"$i\")][0].browser_download_url" "$TEMPDIR/target.json")
          echo "Download url: $URL, dest: $TEMPDIR/$i"
          curl -fsSL "$URL" --retry 3 --retry-delay 5 -o "$TEMPDIR/$i" &
        done < "$TEMPDIR/download_name.txt"
        for job in $(jobs -p); do
          wait "$job"
        done

        # 一時ディレクトリに展開してから、本体（windows-cpuなどの中）を取り出す
        7z x -y -o"$TEMPDIR/tmp-extract" "$TEMPDIR/$(head -1 "$TEMPDIR/download_name.txt")"
        mkdir -p "$DEST"
        mv "$TEMPDIR/tmp-extract/$TARGET"/* "$DEST"

        # 実行ファイルのパーミッションを変更
        if [ "${{ runner.os }}" = "Windows" ]; then
          chmod +x "$DEST/run.exe"
        else
          chmod +x "$DEST/run"
        fi

        echo "::group::ll $DEST"
        ls -al "$DEST"
        echo "::endgroup::"

    - name: Cleanup tempdir
      shell: bash
      run: |
        rm -rf "$TEMPDIR"

    - name: Set output
      id: result
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          echo "run_path=$DEST/run.exe" >> "$GITHUB_OUTPUT"
        else
          echo "run_path=$DEST/run" >> "$GITHUB_OUTPUT"
        fi
        echo "version=$ENGINE_VERSION" >> "$GITHUB_OUTPUT"
