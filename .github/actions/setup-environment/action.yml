name: "Setup environment"
description: |
  依存関係のインストールなどを行う。
runs:
  using: "composite"
  steps:
    - name: Setup variable
      shell: bash
      run: |
        {
          echo "ELECTRON_CACHE=${{ runner.temp }}/electron-cache"
          echo "ELECTRON_BUILDER_CACHE=${{ runner.temp }}/electron-builder-cache"
          echo "cache-version=1"
        } >> "$GITHUB_ENV"

    - name: Setup pnpm
      uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1

    - name: Cache Electron
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.ELECTRON_CACHE }}
        key: ${{ env.cache-version }}-${{ runner.os }}--electron-cache-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ env.cache-version }}-${{ runner.os }}--electron-cache-

    - name: Cache Electron-Builder
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.ELECTRON_BUILDER_CACHE }}
        key: ${{ env.cache-version }}-${{ runner.os }}--electron-builder-cache-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ env.cache-version }}-${{ runner.os }}--electron-builder-cache-

    - shell: bash
      run: pnpm install --frozen-lockfile

    - name: Setup .env
      shell: bash
      run: |
        cp .env.example .env
