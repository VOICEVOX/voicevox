name: "Setup environment"
description: |
  依存関係のインストールなどを行う。
runs:
  using: "composite"
  steps:
    - name: Setup variable
      shell: bash
      run: |
        echo "ELECTRON_CACHE=${{ runner.temp }}/electron-cache" >> $GITHUB_ENV
        echo "ELECTRON_BUILDER_CACHE=${{ runner.temp }}/electron-builder-cache" >> $GITHUB_ENV
        echo "cache-version=1" >> $GITHUB_ENV

    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ".node-version"
        cache: "pnpm"

    - name: Cache Electron
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.ELECTRON_CACHE }}
        key: ${{ env.cache-version }}-${{ runner.os }}--electron-cache-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ env.cache-version }}-${{ runner.os }}--electron-cache-

    - name: Cache Electron-Builder
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.ELECTRON_BUILDER_CACHE }}
        key: ${{ env.cache-version }}-${{ runner.os }}--electron-builder-cache-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ env.cache-version }}-${{ runner.os }}--electron-builder-cache-

    - shell: bash
      run: pnpm install --frozen-lockfile

    - name: Setup .env
      shell: bash
      run: |
        cp .env.example .env
