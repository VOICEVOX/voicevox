name: Check version

on:
  pull_request:
    paths:
      - ".node-version"
      - "package.json"
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  check_node_version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check synchronize volta and .node_version
        uses: My-MC/check-sync-volta-and-node-version@0857819805bc620f7014c7e08963ad5aa0c815ac # v0.0.3
