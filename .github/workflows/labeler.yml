name: Issue Labeler

on:
  issues:
    types: [opened]

defaults:
  run:
    shell: bash

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        configuration-path: .github/labeler.yml
        enable-versioned-regex: 0
